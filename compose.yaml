services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-erp_elec_new}
      POSTGRES_USER: ${DB_USERNAME:-erp_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5443}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    profiles: [redis]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6383}:6379"
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis:/data
volumes:
  postgres:
  redis:
